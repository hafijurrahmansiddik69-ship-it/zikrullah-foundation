    <script>
      // 1. Immediately clean up any stale PWA Service Workers that cause blank/white screens
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function() {});
      }
      // 2. Clear old caches from previous PWA installations
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        }).catch(function() {});
      }
      // 3. Auto-recover if a new deployment changed module hashes (prevent ChunkLoadError white screen)
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (msg.indexOf('dynamically imported module') > -1 || msg.indexOf('loading chunk') > -1) {
          if (!sessionStorage.getItem('zk_chunk_reloaded')) {
            sessionStorage.setItem('zk_chunk_reloaded', '1');
            window.location.reload();
          }
        }
      });
    </script>
