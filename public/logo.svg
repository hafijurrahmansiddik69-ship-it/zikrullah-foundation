<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#045332"/>
      <stop offset="50%" stop-color="#087443"/>
      <stop offset="100%" stop-color="#023e24"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Crescent & Star -->
  <path d="M 270 110 A 100 100 0 1 0 350 270 A 115 115 0 1 1 270 110 Z" fill="url(#goldGrad)"/>
  
  <!-- Mosque Dome & Minarets Silhouette -->
  <g fill="url(#goldGrad)" transform="translate(0, 30)">
    <!-- Main Dome -->
    <path d="M 200 270 Q 256 160 312 270 Z"/>
    <!-- Dome Finial -->
    <path d="M 256 160 L 256 140 M 256 148 L 252 152 M 256 148 L 260 152" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="256" cy="136" r="5" fill="#fef08a"/>
    
    <!-- Open Book (Quran) Base -->
    <path d="M 180 275 Q 256 250 332 275 L 332 300 Q 256 278 180 300 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 256 262 L 256 288" stroke="#045332" stroke-width="3"/>
  </g>

  <!-- Decorative Rays/Stars -->
  <circle cx="340" cy="140" r="8" fill="#fef08a"/>
  <circle cx="170" cy="150" r="5" fill="#fef08a" opacity="0.8"/>

  <!-- Bottom Arch Text Backdrop -->
  <path d="M 60 256 A 196 196 0 0 0 452 256" fill="none" id="textPath"/>

  <!-- Center Typography -->
  <text font-family="'SolaimanLipi', 'Kalpurush', 'Noto Sans Bengali', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" x="256" y="375">
    জিকরুল্লাহ ফাউন্ডেশন
  </text>
  <text font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="19" fill="#fef08a" letter-spacing="2" text-anchor="middle" x="256" y="410">
    ZIKRULLAH FOUNDATION
  </text>
  <text font-family="'SolaimanLipi', sans-serif" font-weight="600" font-size="15" fill="#a7f3d0" text-anchor="middle" x="256" y="438">
    কুরআন-সুন্নাহর আলোকে উম্মাহর খেদমতে
  </text>
</svg>
